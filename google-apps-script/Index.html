<head>

<title>BioPathogenix Client Experience Survey</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f7fb; color: #132238; line-height: 1.5; padding: 24px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid #e4ebf4; border-radius: 16px; box-shadow: 0 12px 28px rgba(17,31,53,.08); overflow: hidden; }
  .logo-bar {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,.08), transparent 26%),
      radial-gradient(circle at 88% 18%, rgba(74,199,255,.16), transparent 30%),
      linear-gradient(135deg, #071425 0%, #0a1b32 45%, #123b4d 100%);
    padding: 18px 24px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .logo-bar::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(255,255,255,.05), transparent 35%, transparent 65%, rgba(255,255,255,.03));
    pointer-events: none;
  }
  .logo-slot {
    width: 144px;
    height: 144px;
    flex: 0 0 auto;
    background: linear-gradient(180deg, #ffffff 0%, #f6f9fc 100%);
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.22);
    box-shadow: 0 18px 28px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.55);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }
  .logo-img {
    height: 126px;
    max-width: 145px;
    width: auto;
    object-fit: contain;
    filter: none;
    transform: scale(1.24);
    transform-origin: center;
  }
  .brand-title {
    display: flex;
    flex-direction: column;
    min-width: 0;
    flex: 1 1 auto;
    padding-left: 6px;
    position: relative;
    z-index: 1;
  }
  .brand-title h1 {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #f4f7fb;
    line-height: 1.15;
  }
  .brand-title p {
    margin-top: 5px;
    font-size: 13px;
    color: rgba(244,247,251,.78);
    max-width: 520px;
  }


  .hdr {
    background: linear-gradient(135deg, #071425 0%, #0b233d 48%, #123b4d 100%);
    color: #fff;
    padding: 22px 28px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 12px 30px rgba(2,10,20,.28);
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .hdr::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top right, rgba(255,255,255,.16), transparent 42%);
    pointer-events: none;
  }
  .hdr h1 { position: relative; z-index: 1; font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
  .hdr p { position: relative; z-index: 1; margin-top: 6px; font-size: 13px; color: rgba(255,255,255,.9); }
  .body { padding: 26px 28px 30px; }
  .q { margin-top: 22px; }
  .q:first-child { margin-top: 0; }
  .ql { display: block; margin-bottom: 8px; font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: #234a8f; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { margin-bottom: 14px; }
  .flabel { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: #5b6d84; }
  input[type=text], input[type=email], select, textarea { width: 100%; padding: 12px 13px; border: 1.4px solid #dfe7f1; border-radius: 10px; background: #fff; color: #132238; font-size: 14px; font-family: inherit; transition: border-color .15s, box-shadow .15s; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #234a8f; box-shadow: 0 0 0 3px rgba(35,74,143,.08); }
  textarea { resize: vertical; min-height: 84px; }
  .orow { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1.4px solid #dfe7f1; border-radius: 10px; cursor: pointer; transition: border-color .15s, background .15s; background: #fff; font-size: 14px; }
  .orow:hover { border-color: #234a8f; background: #f7fafe; }
  .orow.sel { border-color: #234a8f; background: #eef4ff; }
  .orow input { width: 17px; height: 17px; accent-color: #234a8f; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .stars { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .sbtn { min-width: 40px; padding: 10px 0; border: 1.4px solid #dfe7f1; border-radius: 8px; background: #fff; cursor: pointer; font-size: 14px; font-weight: 800; color: #51657d; transition: all .15s; }
  .sbtn:hover { border-color: #234a8f; color: #234a8f; }
  .sbtn.on { background: #234a8f; color: #fff; border-color: #234a8f; }
  .sats { display: flex; flex-wrap: wrap; gap: 6px; }
  .satb { padding: 10px 12px; border: 1.4px solid #dfe7f1; border-radius: 999px; background: #fff; cursor: pointer; font-size: 13px; font-weight: 700; color: #51657d; transition: all .15s; }
  .satb:hover { border-color: #11796f; color: #11796f; }
  .satb.on { background: #11796f; color: #fff; border-color: #11796f; }
  .actions { margin-top: 24px; display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { padding: 13px 22px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: transform .15s, background .15s; }
  .btn:hover { transform: translateY(-1px); }
  .bp { background: #234a8f; color: #fff; }
  .bp:hover { background: #1d3d75; }
  .bp:disabled { background: #8aa9d3; cursor: not-allowed; transform: none; }
  .bs { background: #fff; color: #234a8f; border: 1.4px solid #234a8f; }
  .bs:hover { background: #eef4ff; }
  .err { background: #fef1f1; color: #b42318; padding: 13px 16px; border: 1px solid #f5c2c2; border-radius: 10px; margin-bottom: 18px; font-size: 14px; }
  .ok { text-align: center; padding: 52px 30px; }
  .ck { width: 66px; height: 66px; margin: 0 auto 18px; border-radius: 50%; background: #11796f; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .ok h2 { font-size: 22px; margin-bottom: 10px; }
  .ok p { color: #5b6d84; font-size: 15px; margin-bottom: 22px; }
  .abar { max-width: 760px; margin: 14px auto 0; text-align: center; }
  .alink { color: #6e7d92; font-size: 13px; cursor: pointer; text-decoration: underline; background: none; border: none; font-family: inherit; }
  .apanel { background: #fff; border-radius: 14px; padding: 22px; margin-top: 12px; box-shadow: 0 2px 16px rgba(20,40,70,.08); border: 1px solid #e6edf5; }
  .apanel h3 { font-size: 16px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 7px 8px; text-align: left; border-bottom: 1px solid #eef1f5; }
  th { background: #f7fafe; font-weight: 700; color: #44546a; white-space: nowrap; }
  td { vertical-align: top; }
  .muted { color: #8a97a6; font-size: 13px; }
  .clr { background: none; border: 1px solid #dfe7f1; color: #8a97a6; padding: 6px 11px; border-radius: 7px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .clr:hover { border-color: #b42318; color: #b42318; }
  @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
</style>

    source: f.source==="Other" ? "Other: "+f.sourceOther : f.source,
    validationRating:f.validationRating, validationComment:f.validationComment,
    fasName:f.fasName, fasRating:f.fasRating, fasComment:f.fasComment,
    workflowSuggestions:f.workflow, satisfaction:f.satisfaction,
    productsInterested:[...f.products.filter(p=>p!=="Other"),...(f.products.includes("Other")&&f.productsOther?["Other: "+f.productsOther]:[])].join("; "),
    likelihood:f.likelihood
  });

  const submit = async () => {
    if (sending.current) return;
    const e=valid(); setErrs(e);
    if(e.length){window.scrollTo({top:0,behavior:"smooth"});return;}
    const r=rec(); sending.current=true; setBusy(true);
    try {
      if (!window.google || !google.script || !google.script.run) {
        throw new Error("Please open the deployed Google Apps Script survey link.");
      }
      const result = await new Promise((resolve,reject) => {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)
          .submitSurvey(r,submissionId.current);
      });
      if (!result || result.ok !== true) throw new Error("The server did not confirm sending. Please try again.");
      r.submittedAt = result.submittedAt;
      const up=[...resp,r]; setResp(up); save(up);
      setSub(true); window.scrollTo({top:0,behavior:"smooth"});
    } catch(err) {
      setErrs(["Failed: "+(err.text||err.message||JSON.stringify(err))]);
    }
    sending.current=false; setBusy(false);
  };

  const reset = () => {submissionId.current=crypto.randomUUID();setF(blank);setSub(false);setErrs([]);};
  const csv = () => {
    if(!resp.length) return;
    const cols=["submittedAt","name","org","email","role","source","validationRating","validationComment","fasName","fasRating","fasComment","workflowSuggestions","satisfaction","productsInterested","likelihood"];
    const escCsv=v=>'"'+String(v||"").replace(/"/g,'""')+'"';
    const data=[cols.join(","),...resp.map(r=>cols.map(c=>escCsv(r[c])).join(","))].join("\u000a");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv"}));a.download="bpx_survey.csv";a.click();
  };
  const clrAll = () => {if(window.confirm("Delete all saved responses?")){setResp([]);localStorage.removeItem(SK);}};

  if(sub) return (
    <div className="wrap">
      <div className="card">
        <div className="logo-bar">
          <div className="logo-slot">
            <img src={FORM_LOGO} alt="BioPathogenix" className="logo-img"/>
          </div>
          <div className="brand-title">
            <h1>Thank you</h1>
            <p>Your survey response has been submitted successfully.</p>
          </div>
        </div>
        <div className="ok">
          <div className="ck">✓</div>
          <h2>Submission Complete</h2>
          <p>We received your response and emailed the team.</p>
          <div className="actions" style={{justifyContent:"center"}}>
            <button className="btn bp" onClick={reset}>Submit Another Response</button>
          </div>
        </div>
      </div>
    </div>
  );

  return (
    <div className="wrap">
      <div className="card">
        <div className="logo-bar">
          <div className="logo-slot">
            <img src={FORM_LOGO} alt="BioPathogenix" className="logo-img"/>
          </div>
          <div className="brand-title">
            <h1>BioPathogenix Client Experience Survey</h1>
            <p>Please complete the survey below. Fields marked by context are required.</p>
          </div>
        </div>
        <div className="body">
          {errs.length>0 && <div className="err"><strong>Please fix the following:</strong><ul style={{marginTop:8,paddingLeft:18}}>{errs.map((e,i)=><li key={i}>{e}</li>)}</ul></div>}
          <div className="field"><label className="flabel">Full Name</label><input type="text" value={f.name} onChange={e=>set("name",e.target.value)} placeholder="Your full name"/></div>
          <div className="grid">
            <div className="field"><label className="flabel">Organization</label><input type="text" value={f.org} onChange={e=>set("org",e.target.value)} placeholder="Company / lab / institution"/></div>
            <div className="field"><label className="flabel">Role / Title</label><input type="text" value={f.role} onChange={e=>set("role",e.target.value)} placeholder="Job title"/></div>
          </div>
          <div className="field"><label className="flabel">Email</label><input type="email" value={f.email} onChange={e=>set("email",e.target.value)} placeholder="name@company.com"/></div>
          <div className="q">
            <span className="ql">Q1 &mdash; How did you find us?</span>
            <div className="opts">{SOURCES.map(s=><label key={s} className={"orow "+(f.source===s?"sel":"")}><input type="radio" name="source" checked={f.source===s} onChange={()=>set("source",s)}/><span>{s}</span></label>)}</div>
            {f.source==="Other" && <div className="field" style={{marginTop:10}}><input type="text" value={f.sourceOther} onChange={e=>set("sourceOther",e.target.value)} placeholder="Please specify"/></div>}
          </div>
          <div className="q">
            <span className="ql">Q2 &mdash; Validation Service Rating</span>
            <div className="stars">
              {[1,2,3,4,5].map(n=>{
                const on = Number(f.validationRating||0) >= n;
                return <button key={n} type="button" className={"sbtn "+(on?"on":"")} onClick={()=>set("validationRating",String(n))} style={{minWidth:46,fontSize:24,lineHeight:1,padding:"8px 0"}}>{on ? "★" : "☆"}</button>;
              })}
              <span style={{marginLeft:8,color:"#234a8f",fontWeight:800}}>{f.validationRating ? `Total: ${f.validationRating}/5` : ""}</span>
            </div>
            <div className="field" style={{marginTop:10}}><textarea value={f.validationComment} onChange={e=>set("validationComment",e.target.value)} placeholder="Optional comment"/></div>
          </div>
          <div className="q">
            <span className="ql">Q3 &mdash; FAS Representative Rating</span>
            <div className="field">
              <label className="flabel">Select FAS Name</label>
              <select value={f.fasName} onChange={e=>set("fasName",e.target.value)}>
                <option value="">Choose FAS</option>
                {FAS_NAMES.map(n=><option key={n} value={n}>{n}</option>)}
              </select>
            </div>
            <div className="stars">
              {[1,2,3,4,5].map(n=>{
                const on = Number(f.fasRating||0) >= n;
                return <button key={n} type="button" className={"sbtn "+(on?"on":"")} onClick={()=>set("fasRating",String(n))} style={{minWidth:46,fontSize:24,lineHeight:1,padding:"8px 0"}}>{on ? "★" : "☆"}</button>;
              })}
              <span style={{marginLeft:8,color:"#234a8f",fontWeight:800}}>{f.fasRating ? `Total: ${f.fasRating}/5` : ""}</span>
            </div>
            <div className="field" style={{marginTop:10}}><textarea value={f.fasComment} onChange={e=>set("fasComment",e.target.value)} placeholder="Optional comment"/></div>
          </div>
          <div className="q">
            <span className="ql">Q4 &mdash; Workflow Suggestions</span>
            <div className="field"><textarea value={f.workflow} onChange={e=>set("workflow",e.target.value)} placeholder="Share your suggestions"/></div>
          </div>
          <div className="q">
            <span className="ql">Q5 &mdash; Overall Satisfaction</span>
            <div className="sats">{SAT.map(s=><button key={s} type="button" className={"satb "+(f.satisfaction===s?"on":"")} onClick={()=>set("satisfaction",s)}>{s}</button>)}</div>
          </div>
          <div className="q">
            <span className="ql">Q6 &mdash; Products Interested In</span>
            <div className="opts">{PRODUCTS.map(p=><label key={p} className={"orow "+(f.products.includes(p)?"sel":"")}><input type="checkbox" checked={f.products.includes(p)} onChange={()=>tog(p)}/><span>{p}</span></label>)}</div>
            {f.products.includes("Other") && <div className="field" style={{marginTop:10}}><input type="text" value={f.productsOther} onChange={e=>set("productsOther",e.target.value)} placeholder="Please specify"/></div>}
          </div>
          <div className="q">
            <span className="ql">Q7 &mdash; Likelihood to Recommend</span>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:700,color:"#6e7d92",marginBottom:8}}>
              <span>Likely</span>
              <span>Unlikely</span>
            </div>
            <div className="stars">
              {Array.from({length:11},(_,i)=>10-i).map(n=><button key={n} type="button" className={"sbtn "+(String(f.likelihood)===String(n)?"on":"")} onClick={()=>set("likelihood",String(n))} style={{minWidth:36}}>{n}</button>)}
              <span style={{marginLeft:8,color:"#234a8f",fontWeight:800}}>{f.likelihood!==""?`Total: ${f.likelihood}/10`:""}</span>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"#8a97a6",marginTop:6}}>
              <span>100% likely</span>
              <span>0% likely</span>
            </div>
          </div>
          <div className="actions">
            <button className="btn bp" onClick={submit} disabled={busy}>{busy?"Sending...":"Submit Survey"}</button>
            <button className="btn bs" onClick={reset} type="button">Reset</button>
          </div>
        </div>
      </div>
      <div className="abar">
        <button className="alink" onClick={()=>setShowA(v=>!v)}>{showA?"Hide saved responses":"Show saved responses"}</button>
        {showA && (
          <div className="apanel">
            <h3>Saved Responses</h3>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
              <button className="clr" onClick={csv}>Export CSV</button>
              <button className="clr" onClick={clrAll}>Delete All</button>
              <span className="muted">{resp.length} saved response(s)</span>
            </div>
            {resp.length ? (
              <div style={{overflowX:"auto"}}>
                <table>
                  <thead><tr><th>Submitted</th><th>Name</th><th>Org</th><th>Email</th><th>Source</th><th>Validation</th><th>FAS Name</th><th>FAS Rating</th><th>Satisfaction</th><th>Likelihood</th></tr></thead>
                  <tbody>{resp.slice().reverse().map((r,i)=><tr key={i}><td>{new Date(r.submittedAt).toLocaleString()}</td><td>{r.name}</td><td>{r.org}</td><td>{r.email}</td><td>{r.source}</td><td>{r.validationRating}</td><td>{r.fasName}</td><td>{r.fasRating}</td><td>{r.satisfaction}</td><td>{r.likelihood}</td></tr>)}</tbody>
                </table>
              </div>
            ) : <div className="muted">No saved responses yet.</div>}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
